#                            #
# Starship Config by a3chron #
#                            #

palette = "rose_pine"

# custom format
format = """
[╭─ $shell─────────────── $memory_usage ──╌╌ $nodejs$python$golang$ocaml $fill ╌╌─╮](overlay0)
[├╌](overlay0)$sudo$username$hostname$localip$directory$read_only$git_branch$git_metrics [$fill $cmd_duration ┘](overlay0)
[╰─ $battery $character](overlay0) """

#format = '$all$directory$character'

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 10
command_timeout = 500
add_newline = true

# Rosé Pine palette. The original RAM/IP and hostname blues are retained while
# the prompt's module styles and layout stay unchanged.

[palettes.rose_pine]
rosewater = "#e0def4" # Text
flamingo = "#ebbcba" # Rose
pink = "#ebbcba" # Rose
mauve = "#c4a7e7" # Iris
red = "#eb6f92" # Love
maroon = "#eb6f92" # Love
peach = "#f6c177" # Gold
yellow = "#f6c177" # Gold
green = "#9ccfd8" # Foam
teal = "#9ccfd8" # Foam
sky = "#31748f" # Pine
sapphire = "#74c7ec" # Original hostname accent
blue = "#89b4fa" # Original RAM/IP accent
lavender = "#c4a7e7" # Iris
text = "#e0def4" # Text
subtext1 = "#908caa" # Subtle
subtext0 = "#908caa" # Subtle
overlay2 = "#908caa" # Subtle
overlay1 = "#6e6a86" # Muted
overlay0 = "#6e6a86" # Muted
surface2 = "#524f67" # Highlight High
surface1 = "#403d52" # Highlight Med
surface0 = "#21202e" # Highlight Low
base = "#191724" # Base
mantle = "#1f1d2e" # Surface
crust = "#191724" # Base


[shell]
fish_indicator = 'fish'
bash_indicator = 'bash'
unknown_indicator = 'unknwn'
style = 'teal'
disabled = false

[username]
style_user = 'teal bold'
format = ' [$user@]($style)'
disabled = false
show_always = true

[sudo]
format = ' [sudo](bold red)'
disabled = false

[python]
symbol = ''
format = '[Python](bold mauve) [$version [\($virtualenv\)](dimmed mauve)](dimmed mauve)'
pyenv_version_name = true
detect_files = ['requirements.txt', '__init.py__', 'setup.py']
detect_extensions = ['py']
detect_folders = []

[nodejs]
format = '[Node](bold lavender) [$version](bold dimmed lavender) '

[golang]
format = '[Go](bold lavender) [$version](bold dimmed lavender) '

[ocaml]
format = '[Ocaml](bold pink) [$version](bold dimmed pink) '

[memory_usage]
disabled = false
threshold = -1
format = '[$ram_pct]($style)'
symbol = ''
style = 'dimmed blue'

[localip]
ssh_only = false
format = '[@$localipv4](bold dimmed blue) '
disabled = false

[hostname]
ssh_only = false
ssh_symbol = 'ssh:'
format = '[$ssh_symbol](bold dimmed maroon)[$hostname](bold dimmed sapphire)'
trim_at = ''
disabled = false

[git_metrics]
disabled = false
format = ' [+$added](bold teal)[-$deleted](bold pink)'

[git_branch]
format = '[$branch(:$remote_branch)]($style)'
style = 'bold pink'

[fill]
symbol = ' '
style = 'bold base'

# time of command
[cmd_duration]
min_time = 500
format = ' [$duration](bold dimmed flamingo)'

[directory]
fish_style_pwd_dir_length = 5
disabled = false
truncation_length = 5
truncation_symbol = '…/'
read_only = ' read-only'
read_only_style = 'bold dimmed mauve'
style = 'bold mauve'

# prompt char
[character]
success_symbol = '[──╌╌](overlay0)'
error_symbol = '[──╌╌](red)'

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true


# battery
[battery]

full_symbol = '● '
charging_symbol = '◉ '
discharging_symbol = '◯ '

[[battery.display]]
threshold = 20
style = 'red'

[[battery.display]]
threshold = 100
style = 'teal'
